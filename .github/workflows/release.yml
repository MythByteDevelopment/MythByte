name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate tag and derive version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a version tag like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MythByte.slnx

      - name: Build
        run: dotnet build MythByte.slnx --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Run tests
        run: dotnet test MythByte.slnx --no-build --configuration Release --verbosity normal

  images:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: api
            dockerfile: src/MythByte.API/Dockerfile
          - app: gameserver
            dockerfile: src/MythByte.GameServer/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/mythbyte-${{ matrix.app }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.test.outputs.version }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: VERSION=${{ needs.test.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  client:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    strategy:
      matrix:
        rid: [win-x64, linux-x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish client
        run: >
          dotnet publish src/MythByte.Client/MythByte.Client.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ needs.test.outputs.version }}
          -o publish/MythByte

      - name: Package
        id: package
        run: |
          name="MythByte-${{ needs.test.outputs.version }}-${{ matrix.rid }}"
          cd publish
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            file="$name.zip"
            zip -r "$file" MythByte
          else
            file="$name.tar.gz"
            tar -czf "$file" MythByte
          fi
          sha256sum "$file" > "$file.sha256"
          echo "file=publish/$file" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "${{ steps.package.outputs.file }}" "${{ steps.package.outputs.file }}.sha256" --clobber
