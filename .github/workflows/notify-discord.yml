name: Notify Discord on failure

on:
  workflow_run:
    workflows: ["CI build and test", "Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.event == 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
          NAME: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          payload=$(jq -n \
            --arg title "$NAME failed on $BRANCH" \
            --arg url "$URL" \
            --arg desc "Commit ${SHA:0:7} by $ACTOR" \
            '{username: "GitHub Actions", embeds: [{title: $title, url: $url, description: $desc, color: 9190194}]}')
          curl -sS -f -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"
