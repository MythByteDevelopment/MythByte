name: CI build and test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MythByte.slnx

      - name: Build
        run: dotnet build MythByte.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test MythByte.slnx --no-build --configuration Release --verbosity normal
